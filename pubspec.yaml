name: tut_care
description: "A new Flutter project."

publish_to: 'none'


version: 1.0.0+1

environment:
  sdk: ^3.11.4


dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.8
  flutter_screenutil: ^5.9.3
  flutter_bloc: ^9.1.0
  flutter_svg: ^2.1.0
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  connectivity_plus: ^6.1.4
  injectable: ^2.5.0
  get_it: ^8.0.3
  flutter_native_splash: ^2.4.8
  retrofit: ^4.5.0
  logger: ^2.4.0
  json_annotation: ^4.9.0
  pretty_dio_logger: ^1.4.0
  pin_code_fields: ^8.0.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  equatable: ^2.0.7
  dio: any
  easy_localization: ^3.0.8
  google_maps_flutter: ^2.13.1
  geocoding: ^4.0.0
  location: ^8.0.1
  geolocator: ^14.0.2
  group_radio_button: ^1.3.0
  image_picker: ^1.2.0
  timelines_plus: ^1.0.7
  url_launcher: ^6.3.2
  url_launcher_platform_interface: ^2.3.2
  intl: ^0.20.2
  flutter_polyline_points: ^2.0.0
  flutter_map: ^8.2.2
  flutter_map_location_marker: ^10.1.0
  http: ^1.5.0
  latlong2: ^0.9.1

dev_dependencies:
  flutter_launcher_icons: "^0.14.4"
  injectable_generator: ^2.7.0
  json_serializable: ^6.8.0
  build_runner: ^2.5.4
  retrofit_generator: ^10.3.3
  flutter_test:
    sdk: flutter


  flutter_lints: ^6.0.0


flutter:

  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/translations/



  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter_18pt-Regular.ttf
          weight: 400
        - asset: assets/fonts/inter/Inter_18pt-Medium.ttf
          weight: 500
        - asset: assets/fonts/inter/Inter_18pt-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/inter/Inter_18pt-Bold.ttf
          weight: 700
